bio: |
  I am a PhD student at Trinity College Dublin, working with
  Prof. Johanna Vos. I study the atmospheres of brown dwarfs using atmospheric retrievals on JWST spectra to measure their
  chemistry, temperature structure and clouds. 
# I am a co-developer of the
# Brewster retrieval code.

