experience:
  # Research
  - group: Research
    role: PhD Researcher
    org: Trinity College Dublin
    start: 2025-09-01
    summary: |
      Atmospheric retrievals of the young, cloudy L dwarf 2MASS J0355+1133
      using JWST NIRSpec and MIRI spectra spanning the near- to mid-infrared,
      to constrain its chemistry, temperature structure and clouds.
      Co-developer of the [Brewster](https://github.com/barryodonovan1/brewster_v2)
      retrieval code, and PI of a EuroHPC allocation on the MeluXina
      supercomputer to run these retrievals. Supervised by Prof. Johanna Vos.
  - group: Research
    role: Final-Year Project
    org: University College Cork
    start: 2025-01-01
    end: 2025-08-01
    summary: |
      Giant planet formation with pebble drift and evaporation. Using the
      semi-analytic formation code chemcomp, I modelled the growth of ten
      observed metal-enriched giant exoplanets, reproduced the heavy-element
      content of nine of them, inferred where they formed, and predicted their
      atmospheric C/O and O/H. Published as a first-author paper in
      [A&A](/publications/journal-article/), and runner-up for the IOP Earnshaw Award.
      Supervisor: Prof. Bertram Bitsch.
  - group: Research
    role: Summer Research Intern
    org: University College Cork
    start: 2024-06-01
    end: 2024-09-01
    summary: Galactic habitability in a cosmological simulation.
  - group: Research
    role: Summer Research Intern
    org: University College Cork
    start: 2023-06-01
    end: 2023-08-01
    summary: Magnetically suspended fan for an atmospheric simulation chamber.
